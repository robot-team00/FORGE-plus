# Task 1: Single insertion under a force ceiling
# Isolates budget-setting + clamp — the unit test of the whole idea.
# Protect the fragile part while still seating the robust one.

name: task1_single_insertion
description: "Gear-on-shaft insertion (FORGE GearMesh assets) under a per-object force ceiling"

# Assets: /workspace/assets/factory/factory_gear_{base,medium}.usd — the exact
# FORGE (arXiv 2408.04587) gear set. The medium gear is grasped by its 30 mm
# hub and inserted onto the middle shaft of the gear base.

objects:
  fragile:
    key: abs_gear
    f_break_range_n: [20, 55]
  robust:
    key: steel_gear
    f_break_range_n: [180, 280]

subphases:
  - approach
  - insert
  - seat

disturbances:
  type: pose_offset
  lateral_offset_mm: [-3.0, 3.0]  # uniform range
  depth_offset_mm: [-1.0, 1.0]

success_criterion:
  type: insertion_depth
  threshold_mm: 15.0   # gear bore travels down the 20 mm shaft; seated ≈ 20 mm
  lateral_tolerance_mm: 2.0  # bore must stay concentric with the shaft

failure_modes:
  - wedge_jam        # steady lateral bias + rising axial (bore cocked on shaft)
  - friction_jam     # axial-only, no displacement
  - misalignment     # large lateral offset from initial pose

max_steps: 2000
max_attempts: 5

grippers:
  - franka_panda
  - robotiq_2f140

insertion_axis: z
